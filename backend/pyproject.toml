[project]
name = "crtc-copilot-backend"
version = "0.1.0"
description = "CRTC Proceeding Analysis Copilot - API and agent backend"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi==0.165.0",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.4",
    "pydantic-settings==2.16.3",
    "sqlalchemy[asyncio]==2.1.9",
    "asyncpg==0.32.0",
    "alembic==1.20.1",
    "pgvector==0.5.1",
    "google-auth[requests]==2.62.2",
    "requests==2.34.2",
    "itsdangerous==2.2.0",
    "httpx==0.28.1",
    "tzdata==2026.6",
    # Phase 3 (knowledge-base sync)
    "pymupdf==1.28.2",  # PDF text extraction (AGPL-3.0 or commercial; fine for a local tool)
    "defusedxml==0.7.1",  # XML in DOCX files
    "sentence-transformers==6.3.0",  # local embeddings
    "torch==2.15.0",  # CPU-only build (see [tool.uv.sources])
    # Phase 4-5 (agent, tracing, scheduler)
    "deepagents==0.7.42",
    "langchain==1.5.2",
    "langgraph==1.2.24",
    "langchain-google-genai==4.5.3",
    "langgraph-checkpoint-postgres==3.2.1",
    "psycopg[binary,pool]==3.3.9",
    "langsmith==0.16.2",
    "apscheduler==3.11.3",
    "sse-starlette==3.7.1",
    "python-dotenv==1.2.4",
    "python-multipart>=0.0.34",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "ruff==0.17.6",
]

# torch from the CPU-only index: no CUDA libraries (keeps the install ~1 GB smaller on Linux).
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
